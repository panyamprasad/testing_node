service: user-management-service

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ap-south-1

  environment:
    STAGE: ${self:provider.stage}

    DYNAMODB_TABLE: ${self:custom.config.dynamodbTable}
    S3_BUCKET: ${self:custom.config.bucketName}

    SNS_TOPIC_ARN:
      Ref: UserCreatedTopic

    SQS_QUEUE_URL:
      Ref: UserProcessingQueue

  iam:
    role:
      statements:

        # DynamoDB Permissions
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt UsersTable.Arn

        # S3 Permissions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:custom.config.bucketName}/*

        # SNS Permissions
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - Ref: UserCreatedTopic

        # SQS Permissions
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt UserProcessingQueue.Arn

custom:

  environments:
    dev:
      bucketName: user-dev-files
      dynamodbTable: users-dev
      memorySize: 256

    qa:
      bucketName: user-qa-files
      dynamodbTable: users-qa
      memorySize: 512

  config: ${self:custom.environments.${self:provider.stage}}

functions:

  createUser:
    handler: src/handlers/createUser.handler
    memorySize: ${self:custom.config.memorySize}
    timeout: 30
    events:
      - http:
          path: users
          method: post
          cors: true

  processUser:
    handler: src/handlers/processUser.handler
    timeout: 60
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - UserProcessingQueue
              - Arn
          batchSize: 10

resources:
  Resources:

    #################################################
    # SNS TOPIC
    #################################################

    UserCreatedTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: user-created-topic-${self:provider.stage}

    #################################################
    # DEAD LETTER QUEUE
    #################################################

    UserProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: user-processing-dlq-${self:provider.stage}

    #################################################
    # MAIN QUEUE
    #################################################

    UserProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: user-processing-queue-${self:provider.stage}

        VisibilityTimeout: 60

        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - UserProcessingDLQ
              - Arn
          maxReceiveCount: 3

    #################################################
    # SNS -> SQS SUBSCRIPTION
    #################################################

    QueueSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: UserCreatedTopic
        Protocol: sqs
        Endpoint:
          Fn::GetAtt:
            - UserProcessingQueue
            - Arn

    #################################################
    # SQS ACCESS POLICY
    #################################################

    QueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: UserProcessingQueue

        PolicyDocument:
          Version: "2012-10-17"

          Statement:
            - Effect: Allow

              Principal: "*"

              Action: sqs:SendMessage

              Resource:
                Fn::GetAtt:
                  - UserProcessingQueue
                  - Arn

              Condition:
                ArnEquals:
                  aws:SourceArn:
                    Ref: UserCreatedTopic

    #################################################
    # DYNAMODB
    #################################################

    UsersTable:
      Type: AWS::DynamoDB::Table

      Properties:
        TableName: ${self:custom.config.dynamodbTable}

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S

        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    #################################################
    # S3 BUCKET
    #################################################

    UserFilesBucket:
      Type: AWS::S3::Bucket

      Properties:
        BucketName: ${self:custom.config.bucketName}

        VersioningConfiguration:
          Status: Enabled

        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

outputs:

  BucketName:
    Value:
      Ref: UserFilesBucket

  DynamoDBTable:
    Value:
      Ref: UsersTable

  QueueUrl:
    Value:
      Ref: UserProcessingQueue

  TopicArn:
    Value:
      Ref: UserCreatedTopic


# provider
# environment
# functions
# API Gateway events
# IAM permissions
# DynamoDB resource
# S3 resource
# SNS topic
# SQS queue
# Stage-based configuration (dev, qa, prod)